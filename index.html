<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To-Do List Layout</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="todo-container">
      <h1>To-Do List</h1>

      <div class="task">
        <input type="checkbox" checked />
        <span class="completed">Complete HTML Project</span>
      </div>

      <div class="task">
        <input type="checkbox" />
        <span>Learn CSS Flexbox</span>
      </div>

      <div class="task">
        <input type="checkbox" />
        <span>Practice Grid Layout</span>
      </div>

      <div class="task">
        <input type="checkbox" />
        <span class="complete">Create Portfolio Website</span>
      </div>

      <div class="task">
        <input type="checkbox" />
        <span>Apply for Internship</span>
      </div>

      <button>Add New Task</button>
    </div>
  </body>
</html>
